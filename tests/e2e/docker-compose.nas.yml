# Optional runtime dependency installation on a bind-mounted data disk. SQLite stays in the
# local bind mounts. Some managed Docker platforms reject named volumes.
x-nas-environment: &nas-environment
  E2E_NAS_MODE: "1"
  COREPACK_HOME: /cache/corepack
  XDG_CACHE_HOME: /cache/xdg
  NODE_USE_ENV_PROXY: "1"
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-},localhost,127.0.0.1,::1,.nip.io,gateway-under-test,bark-target,ssh-target,ssh-target-mfa,ssh-target-legacy-node,ssh-target-npm-codex
  no_proxy: ${NO_PROXY:-},localhost,127.0.0.1,::1,.nip.io,gateway-under-test,bark-target,ssh-target,ssh-target-mfa,ssh-target-legacy-node,ssh-target-npm-codex

services:
  # SSH scenarios use their own writable local workspace. File/Git scenarios create their own
  # fixtures, so the remote codex user does not need access to the private NAS source checkout.
  ssh-target:
    volumes: !override []

  ssh-target-legacy-node:
    volumes: !override []

  ssh-target-npm-codex:
    volumes: !override []

  ssh-target-mfa:
    volumes: !override []

  bark-target:
    command: ["node", "/e2e-source/tests/e2e/bark-server.ts"]
    volumes: !override
      - ${E2E_NAS_RUN_DIR:?}/workspace:/e2e-source:ro
      - ${E2E_LOCAL_RUN_DIR:?}/bark-requests:/requests

  build-runner:
    image: codex-gateway-e2e-nas-runner
    build:
      target: nas-runtime
    environment:
      <<: *nas-environment
    volumes:
      - ${E2E_LOCAL_RUN_DIR:?}/data:/workspace/codex-gateway/.data-e2e
      - ${E2E_NAS_RUN_DIR:?}/workspace:/workspace/codex-gateway
      - ${E2E_NAS_ROOT:?}/cache:/cache
      - ${E2E_PNPM_STORE:?}:/cache/pnpm-store
      - ${E2E_NAS_RUN_DIR:?}/build-output:/e2e-output

  gateway-under-test:
    image: codex-gateway-e2e-nas-runner
    environment:
      E2E_NAS_MODE: "1"
      TMPDIR: /nas-tmp
    volumes:
      - ${E2E_LOCAL_RUN_DIR:?}/data:/workspace/codex-gateway/.data-e2e
      - ${E2E_NAS_RUN_DIR:?}/build-output:/e2e-output:ro
      - ${E2E_NAS_RUN_DIR:?}/gateway-tmp:/nas-tmp

  browser-preview-ingress:
    command:
      [
        "nginx",
        "-c",
        "/e2e-config/tests/e2e/docker/browser-preview-nginx.conf",
        "-g",
        "daemon off;",
      ]
    volumes: !override
      - ${E2E_NAS_RUN_DIR:?}/workspace:/e2e-config:ro

  test-runner:
    image: codex-gateway-e2e-nas-runner
    environment:
      <<: *nas-environment
      E2E_APT_DIRECT: ${E2E_APT_DIRECT:-0}
      E2E_HOST_CONNECT_TIMEOUT_MS: ${E2E_HOST_CONNECT_TIMEOUT_MS:-120000}
      E2E_REMOTE_PROJECT_PATH: ${E2E_NAS_REMOTE_PROJECT_PATH:-/home/codex/e2e-workspace}
      E2E_PREPARE_REMOTE_PROJECT_DIR: "1"
    volumes:
      - ${E2E_LOCAL_RUN_DIR:?}/data:/workspace/codex-gateway/.data-e2e
      - ${E2E_LOCAL_RUN_DIR:?}/bark-requests:/bark-requests
      - ${E2E_LOCAL_RUN_DIR:?}/runner-home:/home/pwuser
      - ${E2E_NAS_RUN_DIR:?}/workspace:/workspace/codex-gateway
      - ${E2E_NAS_ROOT:?}/cache:/cache
      - ${E2E_PNPM_STORE:?}:/cache/pnpm-store
      - ${E2E_NAS_ROOT:?}/browsers:/ms-playwright
